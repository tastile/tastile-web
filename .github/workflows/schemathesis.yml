name: schemathesis contract tests

# Runs schemathesis against the live Tastile Core API to catch OpenAPI spec
# drift before it ships. Tastile_TEST_TOKEN is the api-token of a dedicated
# test identity (auth'd fuzz POSTs mutate real data).
#
# See docs/plans/2026-08-06-schemathesis-contract-testing.md (L1) and
# docs/plans/2026-08-06c-schemathesis-ci-and-examples.md (L3).

on:
  schedule:
    # Weekly Sunday 03:00 UTC — outside peak traffic windows.
    - cron: "0 3 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "tastile-web/public/openapi.yaml"
      - "tastile-web/schemathesis.toml"
      - "tastile-web/scripts/run-schemathesis.mjs"
      - "tastile-web/package.json"
      - ".github/workflows/schemathesis.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: schemathesis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TASTILE_TEST_TOKEN: ${{ secrets.TASTILE_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache uv toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('tastile-web/bun.lockb', 'tastile-web/package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install bun dependencies
        working-directory: tastile-web
        run: bun install --frozen-lockfile

      - name: Run schemathesis contract tests
        working-directory: tastile-web
        run: bun run contract:test --seed=42 --max-examples=5

      - name: Upload schemathesis report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: |
            tastile-web/.schemathesis/
          retention-days: 7

      - name: Comment on PR with summary
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: schemathesis contract test
          message: |
            ${{ job.status == 'success' && '✅ contract test passed' || '❌ contract test failed — see job log for failure details' }}
