name: schemathesis contract tests

# Runs schemathesis against the live Tastile Core API to catch OpenAPI spec
# drift before it ships. Tastile_TEST_TOKEN is the api-token of a dedicated
# test identity (auth'd fuzz POSTs mutate real data).
#
# See docs/plans/2026-08-06-schemathesis-contract-testing.md (L1) and
# docs/plans/2026-08-06c-schemathesis-ci-and-examples.md (L3).

on:
  schedule:
    # Weekly Sunday 03:00 UTC — outside peak traffic windows.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: schemathesis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-test:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Fetch Schemathesis token from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID_PROD }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID_PROD }}
          environment: prod
          path: /tastile/core
          export-type: env

      - name: Run schemathesis contract tests
        run: node scripts/run-schemathesis.mjs --seed=42 --max-examples=5

      - name: Upload schemathesis report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: |
            .schemathesis/
          retention-days: 7
