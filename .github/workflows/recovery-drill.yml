name: Recovery drill

# Weekly cron verifies the web-local recovery primitives
# (ADR-0008 soft/hard checkpoint + scripts/release/ helpers + docs/journal/
#  writability) stay green without flapping on contributor pushes.
# Mirrors tastile-android/.github/workflows/recovery-drill.yml but uses
# `bun test` / `bun run check` instead of Pester.
#
# canonical references:
#   - docs/adr/0007-release-branch-and-ticket-workflow.md
#   - docs/adr/0008-structured-recovery-checkpoint.md
#   - docs/adr/0011-tastile-precommit-review-canonical-precedence.md
#   - ../../.agent-loop/checkpoint.schema.json

on:
  schedule:
    # 17:03 UTC Monday = 02:03 JST Tuesday off-hours
    - cron: '3 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    name: web recovery primitives round-trip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify scripts/release/init-journal.sh idempotency
        shell: bash
        run: |
          set -euo pipefail
          ENV=ci-drill ./scripts/release/init-journal.sh
          ENV=ci-drill ./scripts/release/init-journal.sh  # idempotent

      - name: Verify scripts/release/release-checkpoint.sh SKIP_GATE path
        shell: bash
        run: |
          set -euo pipefail
          ENV=ci-drill SKIP_GATE=1 ISSUE_NUMBER=9999 EXECUTION_GENERATION=1 \
            ./scripts/release/release-checkpoint.sh
          # journal entry must have been written
          test -s docs/journal/ci-drill/$(TZ=Asia/Tokyo date +%Y-%m-%d).jsonl

      - name: Verify scripts/release/tag-release.sh refuses invalid branch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          # Refuses non-release branch — exit code must be 3
          ./scripts/release/tag-release.sh 0.6.0
          exit_code=$?
          set -e
          if [[ "${exit_code}" -ne 3 ]]; then
            echo "expected exit 3 on non-release branch, got ${exit_code}" >&2
            exit 1
          fi
          echo "tag-release.sh correctly refused non-release branch ✓"

      - name: Verify bun run check baseline still green
        run: bun run check
        env:
          TZ: Asia/Tokyo
