name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  sops-check:
    uses: ./.github/workflows/sops-decrypt.yml
    with:
      env: production
    secrets:
      sops_age_key_production: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}

  build-and-deploy:
    needs: sops-check
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate tag version against package.json
        # Per release policy: tag format validation, semver extraction,
        # authoritative version comparison, full quality gate, release
        # build — fail (do not auto-fix) on mismatch.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag version '$VERSION' is not a valid MAJOR.MINOR.PATCH semver"
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag version $VERSION matches package.json version."

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install sops + age (SHA256-pinned)
        env:
          SOPS_VERSION: v3.9.0
          AGE_VERSION: v1.2.0
          SOPS_SHA256: 0d65660fbe785647ff4f1764d7f69edf598f79d6d79ebbef4a501909b6ff6b82
          AGE_SHA256: 2ae71cb3ea761118937a944083f057cfd42f0ef11d197ce72fc2b8780d50c4ef
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          printf '%s  /tmp/sops\n' "${SOPS_SHA256}" | sha256sum -c -
          curl -fsSL -o /tmp/age.tgz "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          printf '%s  /tmp/age.tgz\n' "${AGE_SHA256}" | sha256sum -c -
          mkdir -p /tmp/age-extract
          tar -xzf /tmp/age.tgz -C /tmp/age-extract
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sudo install -m 0755 /tmp/age-extract/age/age /usr/local/bin/age
          sudo install -m 0755 /tmp/age-extract/age/age-keygen /usr/local/bin/age-keygen

      - name: Decrypt production environment locally
        env:
          SOPS_AGE_KEY_PRODUCTION: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/sops/age"
          printf '%s\n' "${SOPS_AGE_KEY_PRODUCTION}" > "${HOME}/.config/sops/age/keys.txt"
          chmod 0600 "${HOME}/.config/sops/age/keys.txt"
          bun run scripts/sops-decrypt.ts --env=production

      - name: Lint, typecheck, test, build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Pin TZ so vitest workers deterministically match local dev (JST).
          # The schedule wire tests in quick-create-schedule-wire.test.ts
          # exercise LocalDate → Instant conversion through
          # `new Date("YYYY-MM-DDT00:00:00")`, which is TZ-dependent on
          # purpose — the conflict is documented in the test itself.
          # GitHub-hosted ubuntu-latest runners default to UTC; without
          # this pin the same tests pass on a JST laptop and fail on CI.
          TZ: Asia/Tokyo
        run: bun run check:release

      - name: Assume AWS role for runtime auth sync
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate and sync production auth env to EC2
        env:
          WEB_INSTANCE_ID: ${{ secrets.WEB_INSTANCE_ID }}
          TASTILE_WEB_BRIDGE_SECRET: ${{ secrets.TASTILE_WEB_BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          test -s .env.production

          get_env() {
            sed -n "s/^$1=//p" .env.production | tail -n 1
          }

          required_auth_keys=(
            BETTER_AUTH_SECRET
            TASTILE_AUTH_DATABASE_URL
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            TASTILE_SES_FROM_ADDRESS
          )

          missing=0
          for key in "${required_auth_keys[@]}"; do
            value="$(get_env "$key")"
            if [ -z "$value" ]; then
              echo "::error::$key is required in decrypted .env.production for production auth"
              missing=1
            fi
          done
          if [ -z "${TASTILE_WEB_BRIDGE_SECRET}" ]; then
            echo "::error::TASTILE_WEB_BRIDGE_SECRET GitHub secret is empty"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::Refusing to deploy with an incomplete production authentication contract"
            exit 1
          fi

          SES_REGION="$(get_env TASTILE_SES_REGION)"
          if [ -z "$SES_REGION" ]; then
            SES_REGION="ap-northeast-1"
          fi

          AUTH_ENV_B64="$(
            {
              for key in                 BETTER_AUTH_SECRET                 TASTILE_AUTH_DATABASE_URL                 GOOGLE_CLIENT_ID                 GOOGLE_CLIENT_SECRET                 GOOGLE_ANDROID_CLIENT_ID                 APPLE_CLIENT_ID                 APPLE_CLIENT_SECRET                 TASTILE_SES_FROM_ADDRESS                 TASTILE_SES_CONFIGURATION_SET
              do
                value="$(get_env "$key")"
                if [ -n "$value" ]; then
                  printf '%s=%s\n' "$key" "$value"
                fi
              done
              printf 'TASTILE_SES_REGION=%s\n' "$SES_REGION"
              printf 'TASTILE_WEB_BRIDGE_SECRET=%s\n' "$TASTILE_WEB_BRIDGE_SECRET"
            } | base64 -w0
          )"

          jq -n --arg payload "$AUTH_ENV_B64" '{commands: [
            "set -euo pipefail",
            "sudo mkdir -p /etc/tastile",
            "sudo touch /etc/tastile/tastile-web.env",
            "sudo sed -i -e '\''/^BETTER_AUTH_SECRET=/d'\'' -e '\''/^TASTILE_AUTH_DATABASE_URL=/d'\'' -e '\''/^GOOGLE_CLIENT_ID=/d'\'' -e '\''/^GOOGLE_CLIENT_SECRET=/d'\'' -e '\''/^GOOGLE_ANDROID_CLIENT_ID=/d'\'' -e '\''/^APPLE_CLIENT_ID=/d'\'' -e '\''/^APPLE_CLIENT_SECRET=/d'\'' -e '\''/^TASTILE_SES_FROM_ADDRESS=/d'\'' -e '\''/^TASTILE_SES_REGION=/d'\'' -e '\''/^TASTILE_SES_CONFIGURATION_SET=/d'\'' -e '\''/^TASTILE_WEB_BRIDGE_SECRET=/d'\'' /etc/tastile/tastile-web.env",
            ("printf %s " + ($payload | @sh) + " | base64 -d | sudo tee -a /etc/tastile/tastile-web.env >/dev/null"),
            "sudo chmod 600 /etc/tastile/tastile-web.env",
            "sudo systemctl daemon-reload"
          ]}' > runtime-auth-ssm.json

          COMMAND_ID="$(
            aws ssm send-command               --instance-ids "$WEB_INSTANCE_ID"               --document-name AWS-RunShellScript               --parameters file://runtime-auth-ssm.json               --output text               --query 'Command.CommandId'
          )"

          aws ssm wait command-executed             --command-id "$COMMAND_ID"             --instance-id "$WEB_INSTANCE_ID"
          STATUS="$(
            aws ssm get-command-invocation               --command-id "$COMMAND_ID"               --instance-id "$WEB_INSTANCE_ID"               --query 'Status'               --output text
          )"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Runtime auth env sync failed with status $STATUS"
            aws ssm get-command-invocation               --command-id "$COMMAND_ID"               --instance-id "$WEB_INSTANCE_ID"               --query '{Status:Status,Error:StandardErrorContent}'               --output json
            exit 1
          fi

      - name: Remove plaintext environment and age key
        if: always()
        run: |
          rm -f .env .env.development .env.production .env.staging .env.dev .env.product
          rm -f "${HOME}/.config/sops/age/keys.txt"

      - name: Package standalone build
        # Mirrors `verify-web-artifact.ts` which rejects any `.env*` path
        # segment. Next.js standalone mode copies `.env.production` (and any
        # other `.env*` files present at build time) into `.next/standalone/`,
        # which would otherwise leak secrets into the deployed artifact and
        # trip the verifier. Strip them here, before zipping, so production
        # runtime env vars continue to come from the systemd EnvironmentFile
        # (per docs/production/v1-core-release.md), not from a bundled file.
        run: |
          mkdir -p dist
          cp -r .next/standalone/. dist/
          cp -r .next/static        dist/.next/
          cp -r public               dist/
          find dist -maxdepth 2 -type f -name '.env*' -delete
          (cd dist && zip -r "../tastile-web-${{ steps.version.outputs.version }}.zip" .)
          bun scripts/verify-web-artifact.ts "tastile-web-${{ steps.version.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: tastile-web-*.zip

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Forward Stripe secrets to runtime env on EC2
        # Mirrors `patch-stripe-env.yml` so every tag-based deploy keeps
        # STRIPE_* / NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY aligned with the
        # systemd EnvironmentFile. Without these, /api/stripe/checkout returns
        # 500 {"error":"Stripe is not configured"} and the UI appears dead.
        # Single-line --parameters (matches deploy.yml's existing pattern)
        # so the runner's bash inlines ${STRIPE_*}; commands are written
        # so each SSM step is self-contained (no ENV_FILE variable carry).
        env:
          WEB_INSTANCE_ID: ${{ secrets.WEB_INSTANCE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PRO_MONTHLY_PRICE_ID }}
          STRIPE_PRO_YEARLY_PRICE_ID: ${{ secrets.STRIPE_PRO_YEARLY_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "$WEB_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "commands=['sudo touch /etc/tastile/tastile-web.env','sudo bash -c \"for n in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRO_MONTHLY_PRICE_ID STRIPE_PRO_YEARLY_PRICE_ID NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY; do sed -i.bak \\\"/^\\${n}=/d\\\" /etc/tastile/tastile-web.env; done\"','sudo bash -c \"printf \\\"STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}\\\\nSTRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}\\\\nSTRIPE_PRO_MONTHLY_PRICE_ID=${STRIPE_PRO_MONTHLY_PRICE_ID}\\\\nSTRIPE_PRO_YEARLY_PRICE_ID=${STRIPE_PRO_YEARLY_PRICE_ID}\\\\nNEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}\\\\n\\\" >> /etc/tastile/tastile-web.env\"','sudo systemctl daemon-reload']" --output text --query 'Command.CommandId')
          echo "ForwardStripeEnv CommandId: $CMD_ID"
          for i in $(seq 1 18); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$WEB_INSTANCE_ID" --output text --query 'Status')
            echo "  [${i}x5s] status=$STATUS"
            [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] && break
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$WEB_INSTANCE_ID"

      - name: Upload to transfer bucket
        id: upload
        env:
          TRANSFER_BUCKET: ${{ secrets.TRANSFER_BUCKET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum "tastile-web-${VERSION}.zip" | awk '{print $1}' > "tastile-web-${VERSION}.zip.sha256"
          aws s3 cp "tastile-web-${VERSION}.zip" "s3://${TRANSFER_BUCKET}/web-builds/${VERSION}.zip"
          aws s3 cp "tastile-web-${VERSION}.zip.sha256" "s3://${TRANSFER_BUCKET}/web-builds/${VERSION}.zip.sha256"
          PRESIGNED=$(aws s3 presign "s3://${TRANSFER_BUCKET}/web-builds/${VERSION}.zip" --expires-in 900)
          EXPECTED_SHA256=$(cat "tastile-web-${VERSION}.zip.sha256")
          echo "presigned=${PRESIGNED}" >> "$GITHUB_OUTPUT"
          echo "expected_sha256=${EXPECTED_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        env:
          WEB_INSTANCE_ID: ${{ secrets.WEB_INSTANCE_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          PRESIGNED: ${{ steps.upload.outputs.presigned }}
          EXPECTED_SHA256: ${{ steps.upload.outputs.expected_sha256 }}
          TASTILE_WEB_BRIDGE_SECRET: ${{ secrets.TASTILE_WEB_BRIDGE_SECRET }}
          CLOUD_API_BASE: http://127.0.0.1:31400
        run: |
          aws ssm send-command \
            --instance-ids "$WEB_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['set -euo pipefail','RELEASES=/opt/tastile/web/releases','CURRENT_LINK=/opt/tastile/web/current','sudo mkdir -p \"\$RELEASES\"','sudo mkdir -p /etc/tastile','sudo mkdir -p /etc/systemd/system/tastile-web.service.d','sudo tee /etc/systemd/system/tastile-web.service.d/cloud-api-base.conf > /dev/null <<DROPIN','[Service]','Environment=CLOUD_API_BASE=${CLOUD_API_BASE}','DROPIN','sudo systemctl daemon-reload','curl -fsSL \"${PRESIGNED}\" -o /tmp/tastile-web-${VERSION}.zip','echo \"${EXPECTED_SHA256}  /tmp/tastile-web-${VERSION}.zip\" | sudo tee /tmp/tastile-web-${VERSION}.zip.sha256.expected >/dev/null','sudo sha256sum -c /tmp/tastile-web-${VERSION}.zip.sha256.expected','sudo rm -rf \"\$RELEASES/tastile-web-${VERSION}\"','sudo mkdir -p \"\$RELEASES/tastile-web-${VERSION}\"','sudo unzip -q /tmp/tastile-web-${VERSION}.zip -d \"\$RELEASES/tastile-web-${VERSION}\"','sudo ln -sfn \"\$RELEASES/tastile-web-${VERSION}\" \"\$CURRENT_LINK\"','sudo systemctl restart tastile-web.service','sudo systemctl is-active tastile-web.service','sleep 5','curl -fsS http://127.0.0.1:3000/ >/dev/null']" \
            --output text --query "Command.CommandId"

      - name: Verify production auth runtime
        env:
          WEB_INSTANCE_ID: ${{ secrets.WEB_INSTANCE_ID }}
        run: |
          set -euo pipefail

          SMOKE_SCRIPT="$(cat <<'SCRIPT'
          set -euo pipefail
          ENV_FILE=/etc/tastile/tastile-web.env

          for key in             BETTER_AUTH_SECRET             TASTILE_AUTH_DATABASE_URL             GOOGLE_CLIENT_ID             GOOGLE_CLIENT_SECRET             TASTILE_SES_FROM_ADDRESS             TASTILE_WEB_BRIDGE_SECRET
          do
            if ! sudo grep -Eq "^$key=.+$" "$ENV_FILE"; then
              echo "missing runtime auth key: $key" >&2
              exit 1
            fi
          done

          AUTH_DB="$(sudo sed -n 's/^TASTILE_AUTH_DATABASE_URL=//p' "$ENV_FILE" | tail -n 1)"
          cd /opt/tastile/web/current
          AUTH_DB="$AUTH_DB" node <<'NODE'
          const { Pool } = require("pg");
          (async () => {
            const pool = new Pool({
              connectionString: process.env.AUTH_DB,
              max: 1,
              connectionTimeoutMillis: 5000,
            });
            try {
              const result = await pool.query("select 1 as ok");
              if (result.rows?.[0]?.ok !== 1) throw new Error("unexpected DB probe result");
            } finally {
              await pool.end();
            }
          })().catch((error) => {
            console.error("BetterAuth database probe failed:", error?.message ?? error);
            process.exit(1);
          });
          NODE

          SESSION_STATUS="$(
            curl -sS               -o /tmp/tastile-auth-session-smoke.json               -w '%{http_code}'               -H 'Cookie: better-auth.session_token=deploy-smoke-invalid'               http://127.0.0.1:3000/api/auth/get-session
          )"
          if [ "$SESSION_STATUS" != "200" ]; then
            echo "BetterAuth get-session smoke failed: HTTP $SESSION_STATUS" >&2
            exit 1
          fi

          SOCIAL_STATUS="$(
            curl -sS               -o /tmp/tastile-auth-social-smoke.json               -w '%{http_code}'               -X POST               -H 'content-type: application/json'               --data '{"provider":"google","callbackURL":"https://app.tastile.app/api/auth/bridge"}'               http://127.0.0.1:3000/api/auth/sign-in/social
          )"
          case "$SOCIAL_STATUS" in
            2??|3??) ;;
            *)
              echo "Google social-start smoke failed: HTTP $SOCIAL_STATUS" >&2
              exit 1
              ;;
          esac
          SCRIPT
          )"

          SMOKE_B64="$(printf '%s' "$SMOKE_SCRIPT" | base64 -w0)"
          jq -n --arg payload "$SMOKE_B64"             '{commands: [("printf %s " + ($payload | @sh) + " | base64 -d | bash")]}'             > auth-smoke-ssm.json

          COMMAND_ID="$(
            aws ssm send-command               --instance-ids "$WEB_INSTANCE_ID"               --document-name AWS-RunShellScript               --parameters file://auth-smoke-ssm.json               --output text               --query 'Command.CommandId'
          )"

          aws ssm wait command-executed             --command-id "$COMMAND_ID"             --instance-id "$WEB_INSTANCE_ID"
          aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "$WEB_INSTANCE_ID"             --query '{Status:Status,Error:StandardErrorContent}'             --output json

