name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')))
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate tag version against package.json
        # Per release policy: tag format validation, semver extraction,
        # authoritative version comparison, full quality gate, release
        # build — fail (do not auto-fix) on mismatch.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag version '$VERSION' is not a valid MAJOR.MINOR.PATCH semver"
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag version $VERSION matches package.json version."

      - name: Install
        run: bun install --frozen-lockfile

      - name: Checkout canonical OpenAPI spec
        # public/openapi.yaml is gitignored and read by
        # src/app/api/openapi/route.ts at build time. Fresh CI checkouts
        # lack the workspace-shell submodule, so fetch the canonical
        # spec repo (same pattern as quality.yml) and stage the copy.
        uses: actions/checkout@v4
        with:
          repository: tastile/tastile-openapi
          path: openapi-spec
          ref: main

      - name: Stage public openapi.yaml for build
        run: cp openapi-spec/openapi.yaml ./public/openapi.yaml

      - name: Lint, typecheck, and test
        env:
          # Pin TZ so vitest workers deterministically match local dev (JST).
          # The schedule wire tests in quick-create-schedule-wire.test.ts
          # exercise LocalDate → Instant conversion through
          # `new Date("YYYY-MM-DDT00:00:00")`, which is TZ-dependent on
          # purpose — the conflict is documented in the test itself.
          # GitHub-hosted ubuntu-latest runners default to UTC; without
          # this pin the same tests pass on a JST laptop and fail on CI.
          TZ: Asia/Tokyo
        run: bun run check

      - name: Audit production dependencies
        run: bun audit --production --ignore=GHSA-qx2v-qp2m-jg93 --ignore=GHSA-6g55-p6wh-862q --ignore=GHSA-r28c-9q8g-f849 --ignore=GHSA-f88m-g3jw-g9cj

      - name: Fetch release environment from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG_PROD }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID_PROD }}
          environment: prod
          path: /tastile/web
          export-type: env

      - name: Build production bundle
        env:
          NEXT_TELEMETRY_DISABLED: 1
          TZ: Asia/Tokyo
        run: bun run build:prod

      - name: Remove generated environment file
        if: always()
        run: rm -f .env .env.development .env.production .env.staging .env.dev .env.product

      - name: Package standalone build
        # Mirrors `verify-web-artifact.ts` which rejects any `.env*` path
        # segment. Next.js standalone mode copies `.env.production` (and any
        # other `.env*` files present at build time) into `.next/standalone/`,
        # which would otherwise leak secrets into the deployed artifact and
        # trip the verifier. Strip them here, before zipping, so production
        # runtime env vars are fetched directly from Infisical by systemd,
        # not from a bundled file or host environment file.
        run: |
          mkdir -p dist
          cp -r .next/standalone/. dist/
          cp -r .next/static        dist/.next/
          cp -r public               dist/
          mkdir -p dist/ops/systemd
          cp ops/systemd/tastile-web.service.example dist/ops/systemd/tastile-web.service.example
          find dist -maxdepth 2 -type f -name '.env*' -delete
          (cd dist && zip -r "../tastile-web-${{ steps.version.outputs.version }}.zip" .)
          bun scripts/verify-web-artifact.ts "tastile-web-${{ steps.version.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: tastile-web-*.zip

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to transfer bucket
        id: upload
        env:
          TRANSFER_BUCKET: ${{ vars.TRANSFER_BUCKET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum "tastile-web-${VERSION}.zip" | awk '{print $1}' > "tastile-web-${VERSION}.zip.sha256"
          aws s3 cp "tastile-web-${VERSION}.zip" "s3://${TRANSFER_BUCKET}/web-builds/${VERSION}.zip"
          aws s3 cp "tastile-web-${VERSION}.zip.sha256" "s3://${TRANSFER_BUCKET}/web-builds/${VERSION}.zip.sha256"
          PRESIGNED=$(aws s3 presign "s3://${TRANSFER_BUCKET}/web-builds/${VERSION}.zip" --expires-in 900)
          EXPECTED_SHA256=$(cat "tastile-web-${VERSION}.zip.sha256")
          echo "presigned=${PRESIGNED}" >> "$GITHUB_OUTPUT"
          echo "expected_sha256=${EXPECTED_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        id: deploy
        # Single-line AWS CLI shorthand for SSM `--parameters "commands=[...]"`.
        # Replaces the prior `jq -cn '{commands:[...]}'` pattern which embedded
        # bash heredoc newlines via jq `"\n"` escapes — those collapsed into a
        # single command string where `<<DROPIN` opened a heredoc but never
        # closed (the literal `DROPIN` was nested inside the same command
        # string, not a heredoc terminator), producing "syntax error near
        # unexpected token `)'`. The string-array form here keeps each command
        # on its own element so SSM executes them sequentially; the systemd
        # drop-in is written via `printf '[Service]\n...\n'` (no heredoc),
        # and CLOUD_API_BASE is exported as its own host shell variable so
        # printf can reference it via shell expansion.
        env:
          WEB_INSTANCE_ID: ${{ vars.WEB_INSTANCE_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          PRESIGNED: ${{ steps.upload.outputs.presigned }}
          EXPECTED_SHA256: ${{ steps.upload.outputs.expected_sha256 }}
          CLOUD_API_BASE: http://127.0.0.1:31400
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$WEB_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['set -euo pipefail','RELEASES=/opt/tastile/web/releases','CURRENT_LINK=/opt/tastile/web/current','export CLOUD_API_BASE=${CLOUD_API_BASE}','sudo mkdir -p \"$RELEASES\"','sudo mkdir -p /etc/systemd/system/tastile-web.service.d','sudo bash -c \"printf \'[Service]\nEnvironment=CLOUD_API_BASE=%s\n\' \\\"\$CLOUD_API_BASE\\\"\" | sudo tee /etc/systemd/system/tastile-web.service.d/cloud-api-base.conf >/dev/null','sudo systemctl daemon-reload','curl -fsSL \"${PRESIGNED}\" -o /tmp/tastile-web-${VERSION}.zip','echo \"${EXPECTED_SHA256}  /tmp/tastile-web-${VERSION}.zip\" | sudo tee /tmp/tastile-web-${VERSION}.zip.sha256.expected >/dev/null','sudo sha256sum -c /tmp/tastile-web-${VERSION}.zip.sha256.expected','sudo rm -rf \"$RELEASES/tastile-web-${VERSION}\"','sudo mkdir -p \"$RELEASES/tastile-web-${VERSION}\"','sudo unzip -q /tmp/tastile-web-${VERSION}.zip -d \"$RELEASES/tastile-web-${VERSION}\"','sudo install -m 0644 \"$RELEASES/tastile-web-${VERSION}/ops/systemd/tastile-web.service.example\" /etc/systemd/system/tastile-web.service','sudo ln -sfn \"$RELEASES/tastile-web-${VERSION}\" \"$CURRENT_LINK\"','sudo systemctl daemon-reload','sudo systemctl restart tastile-web.service','sudo systemctl is-active tastile-web.service','sleep 5','curl -fsS http://127.0.0.1:3000/ >/dev/null']" \
            --output text --query "Command.CommandId")
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and verify success
        env:
          WEB_INSTANCE_ID: ${{ vars.WEB_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$WEB_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) echo "SSM deployment completed successfully."; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                EXIT_CODE=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$WEB_INSTANCE_ID" \
                  --query ResponseCode --output text 2>/dev/null || true)
                echo "SSM deployment ended with status=$STATUS response_code=$EXIT_CODE" >&2
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out waiting for the SSM deployment command." >&2
          exit 1
