name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Create public build environment
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          TASTILE_DESKTOP_MANIFEST_URL: ${{ secrets.TASTILE_DESKTOP_MANIFEST_URL }}
          NEXT_PUBLIC_TASTILE_DESKTOP_VERSION: ${{ secrets.NEXT_PUBLIC_TASTILE_DESKTOP_VERSION }}
          TASTILE_DESKTOP_VERSION: ${{ secrets.TASTILE_DESKTOP_VERSION }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_COGNITO_HOSTED_UI_DOMAIN: ${{ secrets.NEXT_PUBLIC_COGNITO_HOSTED_UI_DOMAIN }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_ISSUER: ${{ secrets.NEXT_PUBLIC_COGNITO_ISSUER }}
          NEXT_PUBLIC_COGNITO_JWKS_URL: ${{ secrets.NEXT_PUBLIC_COGNITO_JWKS_URL }}
        run: |
          cat > .env.product <<ENVEOF
          NEXT_PUBLIC_APP_URL=https://app.tastile.app
          NEXT_PUBLIC_APEX_HOST=tastile.app
          NEXT_PUBLIC_APP_HOST=app.tastile.app
          TASTILE_DESKTOP_MANIFEST_URL=${TASTILE_DESKTOP_MANIFEST_URL}
          NEXT_PUBLIC_TASTILE_DESKTOP_VERSION=${NEXT_PUBLIC_TASTILE_DESKTOP_VERSION}
          TASTILE_DESKTOP_VERSION=${TASTILE_DESKTOP_VERSION}
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID}
          NEXT_PUBLIC_DAEMON_BASE_URL=https://api.tastile.app
          NEXT_PUBLIC_COGNITO_HOSTED_UI_DOMAIN=${NEXT_PUBLIC_COGNITO_HOSTED_UI_DOMAIN}
          NEXT_PUBLIC_COGNITO_CLIENT_ID=${NEXT_PUBLIC_COGNITO_CLIENT_ID}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID=${NEXT_PUBLIC_COGNITO_USER_POOL_ID}
          NEXT_PUBLIC_COGNITO_REGION=ap-northeast-1
          NEXT_PUBLIC_COGNITO_ISSUER=${NEXT_PUBLIC_COGNITO_ISSUER}
          NEXT_PUBLIC_COGNITO_JWKS_URL=${NEXT_PUBLIC_COGNITO_JWKS_URL}
          NEXT_PUBLIC_COGNITO_CALLBACK_URL=https://app.tastile.app/auth/callback
          NEXT_PUBLIC_COGNITO_LOGOUT_URL=https://app.tastile.app
          NEXT_PUBLIC_COGNITO_ENABLED_PROVIDERS=Google,SignInWithApple
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
          CLOUD_API_BASE=http://127.0.0.1:31400
          ENVEOF

      - name: Lint, typecheck, test, build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: bun run check:release

      - name: Package standalone build
        run: |
          mkdir -p dist
          cp -r .next/standalone/. dist/
          cp -r .next/static        dist/.next/
          cp -r public               dist/
          (cd dist && zip -r "../tastile-web-${{ steps.version.outputs.version }}.zip" .)
          bun scripts/verify-web-artifact.ts "tastile-web-${{ steps.version.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: tastile-web-*.zip

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Forward Stripe secrets to runtime env on EC2
        # Mirrors `patch-stripe-env.yml` so every tag-based deploy keeps
        # STRIPE_* / NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY aligned with the
        # systemd EnvironmentFile. Without these, /api/stripe/checkout returns
        # 500 {"error":"Stripe is not configured"} and the UI appears dead.
        # Single-line --parameters (matches deploy.yml's existing pattern)
        # so the runner's bash inlines ${STRIPE_*}; commands are written
        # so each SSM step is self-contained (no ENV_FILE variable carry).
        env:
          WEB_INSTANCE_ID: ${{ secrets.WEB_INSTANCE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PRO_MONTHLY_PRICE_ID }}
          STRIPE_PRO_YEARLY_PRICE_ID: ${{ secrets.STRIPE_PRO_YEARLY_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "$WEB_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "commands=['sudo touch /etc/tastile/tastile-web.env','sudo bash -c \"for n in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRO_MONTHLY_PRICE_ID STRIPE_PRO_YEARLY_PRICE_ID NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY; do sed -i.bak \\\"/^\\${n}=/d\\\" /etc/tastile/tastile-web.env; done\"','sudo bash -c \"printf \\\"STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}\\\\nSTRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}\\\\nSTRIPE_PRO_MONTHLY_PRICE_ID=${STRIPE_PRO_MONTHLY_PRICE_ID}\\\\nSTRIPE_PRO_YEARLY_PRICE_ID=${STRIPE_PRO_YEARLY_PRICE_ID}\\\\nNEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}\\\\n\\\" >> /etc/tastile/tastile-web.env\"','sudo systemctl daemon-reload']" --output text --query 'Command.CommandId')
          echo "ForwardStripeEnv CommandId: $CMD_ID"
          for i in $(seq 1 18); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$WEB_INSTANCE_ID" --output text --query 'Status')
            echo "  [${i}x5s] status=$STATUS"
            [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] && break
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$WEB_INSTANCE_ID"

      - name: Upload to transfer bucket
        id: upload
        env:
          TRANSFER_BUCKET: ${{ secrets.TRANSFER_BUCKET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum "tastile-web-${VERSION}.zip" | awk '{print $1}' > "tastile-web-${VERSION}.zip.sha256"
          aws s3 cp "tastile-web-${VERSION}.zip" "s3://${TRANSFER_BUCKET}/web-builds/${VERSION}.zip"
          aws s3 cp "tastile-web-${VERSION}.zip.sha256" "s3://${TRANSFER_BUCKET}/web-builds/${VERSION}.zip.sha256"
          PRESIGNED=$(aws s3 presign "s3://${TRANSFER_BUCKET}/web-builds/${VERSION}.zip" --expires-in 900)
          EXPECTED_SHA256=$(cat "tastile-web-${VERSION}.zip.sha256")
          echo "presigned=${PRESIGNED}" >> "$GITHUB_OUTPUT"
          echo "expected_sha256=${EXPECTED_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        env:
          WEB_INSTANCE_ID: ${{ secrets.WEB_INSTANCE_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          PRESIGNED: ${{ steps.upload.outputs.presigned }}
          EXPECTED_SHA256: ${{ steps.upload.outputs.expected_sha256 }}
          TASTILE_WEB_BRIDGE_SECRET: ${{ secrets.TASTILE_WEB_BRIDGE_SECRET }}
        run: |
          aws ssm send-command \
            --instance-ids "$WEB_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['set -euo pipefail','RELEASES=/opt/tastile/web/releases','CURRENT_LINK=/opt/tastile/web/current','sudo mkdir -p \"\$RELEASES\"','sudo mkdir -p /etc/tastile','sudo touch /etc/tastile/tastile-web.env','sudo sed -i.bak \"/^TASTILE_WEB_BRIDGE_SECRET=/d\" /etc/tastile/tastile-web.env','printf \"%s\n\" \"TASTILE_WEB_BRIDGE_SECRET=${TASTILE_WEB_BRIDGE_SECRET}\" | sudo tee -a /etc/tastile/tastile-web.env >/dev/null','curl -fsSL \"${PRESIGNED}\" -o /tmp/tastile-web-${VERSION}.zip','echo \"${EXPECTED_SHA256}  /tmp/tastile-web-${VERSION}.zip\" | sudo tee /tmp/tastile-web-${VERSION}.zip.sha256.expected >/dev/null','sudo sha256sum -c /tmp/tastile-web-${VERSION}.zip.sha256.expected','sudo rm -rf \"\$RELEASES/tastile-web-${VERSION}\"','sudo mkdir -p \"\$RELEASES/tastile-web-${VERSION}\"','sudo unzip -q /tmp/tastile-web-${VERSION}.zip -d \"\$RELEASES/tastile-web-${VERSION}\"','sudo ln -sfn \"\$RELEASES/tastile-web-${VERSION}\" \"\$CURRENT_LINK\"','sudo systemctl restart tastile-web.service','sudo systemctl is-active tastile-web.service','sleep 5','curl -fsS http://127.0.0.1:3000/ >/dev/null']" \
            --output text --query "Command.CommandId"
