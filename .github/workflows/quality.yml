name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release-*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install sops + age (SHA256-pinned)
        env:
          SOPS_VERSION: v3.9.0
          AGE_VERSION: v1.2.0
          SOPS_SHA256: 0d65660fbe785647ff4f1764d7f69edf598f79d6d79ebbef4a501909b6ff6b82
          AGE_SHA256: 2ae71cb3ea761118937a944083f057cfd42f0ef11d197ce72fc2b8780d50c4ef
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          printf '%s  /tmp/sops\n' "${SOPS_SHA256}" | sha256sum -c -
          curl -fsSL -o /tmp/age.tgz "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          printf '%s  /tmp/age.tgz\n' "${AGE_SHA256}" | sha256sum -c -
          mkdir -p /tmp/age-extract
          tar -xzf /tmp/age.tgz -C /tmp/age-extract
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sudo install -m 0755 /tmp/age-extract/age/age /usr/local/bin/age
          sudo install -m 0755 /tmp/age-extract/age/age-keygen /usr/local/bin/age-keygen

      - name: Decrypt build environments locally
        env:
          SOPS_AGE_KEY_DEVELOPMENT: ${{ secrets.SOPS_AGE_KEY_DEVELOPMENT }}
          SOPS_AGE_KEY_PRODUCTION: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/sops/age"
          printf '%s\n' "${SOPS_AGE_KEY_DEVELOPMENT}" > "${HOME}/.config/sops/age/keys.txt"
          chmod 0600 "${HOME}/.config/sops/age/keys.txt"
          bun run scripts/sops-decrypt.ts --env=development
          printf '%s\n' "${SOPS_AGE_KEY_PRODUCTION}" > "${HOME}/.config/sops/age/keys.txt"
          bun run scripts/sops-decrypt.ts --env=production

      - name: Stage public openapi.yaml for build
        # public/openapi.yaml is gitignored and read by
        # src/app/api/openapi/route.ts at build time. The OpenAPI spec
        # is vendored from this repository's `openapi/` submodule (see
        # .gitmodules); the submodule pointer is the pinned revision.
        # Pinned-revision verification stays in W04 scope.
        run: cp openapi/openapi.yaml ./public/openapi.yaml

      - name: Validate repository
        run: bun run check
        env:
          CLOUD_API_BASE: http://127.0.0.1:31400
          TZ: Asia/Tokyo

      - name: Audit production dependencies
        run: bun audit --production --ignore=GHSA-qx2v-qp2m-jg93 --ignore=GHSA-6g55-p6wh-862q --ignore=GHSA-r28c-9q8g-f849 --ignore=GHSA-f88m-g3jw-g9cj

  release-build:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')))
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')))
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stage public openapi.yaml for build
        # Vendored from this repository's `openapi/` submodule (see
        # .gitmodules); the submodule pointer is the pinned revision.
        run: cp openapi/openapi.yaml ./public/openapi.yaml

      - name: Fetch release environment from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID_PROD }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID_PROD }}
          environment: prod
          path: /tastile/web
          export-type: env

      - name: Build production bundle
        run: bun run build:prod

      - name: Remove generated environment file
        if: always()
        run: rm -f .env .env.development .env.production .env.staging .env.dev .env.product

  # Real-Postgres concurrency test for the /api/cli/token grant store
  # (Issue #153, plan D10).  Same job as in pr-smoke.yml so the
  # release-grade gate proves the grant atomicity before a release-*
  # branch is cut.
  cli-auth-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cli_auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d cli_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TASTILE_AUTH_DATABASE_URL: postgres://test:test@localhost:5432/cli_auth_test
      NEXT_PUBLIC_DAEMON_BASE_URL: http://127.0.0.1:31400
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run grant-store concurrency integration test
        run: bun test src/shared/auth/cli/grant-store.integration.test.ts
