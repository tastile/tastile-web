name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release-*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Secrets for the release build are pulled from Infisical via the
      # dedicated `release-build` job below using GitHub OIDC (no SOPS, no
      # per-env age keys). The verify job here runs `bun run check` against
      # the repository's own secrets-free test fixtures and the canonical
      # OpenAPI spec staged from the vendored submodule below.
      - name: Stage public openapi.yaml for build
        # public/openapi.yaml is gitignored and read by
        # src/app/api/openapi/route.ts at build time. The OpenAPI spec
        # is vendored from this repository's `openapi/` submodule (see
        # .gitmodules); the submodule pointer is the pinned revision.
        # Pinned-revision verification stays in W04 scope.
        run: cp openapi/openapi.yaml ./public/openapi.yaml

      - name: Validate repository
        run: bun run check
        env:
          CLOUD_API_BASE: http://127.0.0.1:31400
          TZ: Asia/Tokyo

      - name: Audit production dependencies
        run: bun audit --production --ignore=GHSA-qx2v-qp2m-jg93 --ignore=GHSA-6g55-p6wh-862q --ignore=GHSA-r28c-9q8g-f849 --ignore=GHSA-f88m-g3jw-g9cj

  release-build:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')))
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')))
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stage public openapi.yaml for build
        # Vendored from this repository's `openapi/` submodule (see
        # .gitmodules); the submodule pointer is the pinned revision.
        run: cp openapi/openapi.yaml ./public/openapi.yaml

      - name: Fetch release environment from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID_PROD }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID_PROD }}
          environment: prod
          path: /tastile/web
          export-type: env

      - name: Build production bundle
        run: bun run build:prod

      - name: Remove generated environment file
        if: always()
        run: rm -f .env .env.development .env.production .env.staging .env.dev .env.product

  # Real-Postgres concurrency test for the /api/cli/token grant store
  # (Issue #153, plan D10).  Same job as in pr-smoke.yml so the
  # release-grade gate proves the grant atomicity before a release-*
  # branch is cut.
  cli-auth-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cli_auth_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d cli_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TASTILE_AUTH_DATABASE_URL: postgres://test:test@localhost:5432/cli_auth_test
      NEXT_PUBLIC_DAEMON_BASE_URL: http://127.0.0.1:31400
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run grant-store concurrency integration test
        run: bun test src/shared/auth/cli/grant-store.integration.test.ts
