name: quality

# Decryption uses one age private key per env (development / staging /
# production), materialized by the sops-decrypt reusable workflow from the
# SOPS_AGE_KEY_DEVELOPMENT / _STAGING / _PRODUCTION secrets. No AWS OIDC
# role assumption is involved, so we no longer need id-token: write on
# this caller; see scripts/sops.config.ts for the recipient values and
# docs/runbooks/sops-rotation.md for rotation steps.
on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release-*
  workflow_dispatch:

jobs:
  decrypt:
    permissions:
      contents: read
    # Decrypt every env that has ciphertext + a registered secret.
    # The verify job's build:prod requires a real .env.production, so
    # development alone is not enough. Staging stays out until
    # .env.staging.sops exists (follow-up ticket).
    strategy:
      matrix:
        env: [development, production]
    uses: ./.github/workflows/sops-decrypt.yml
    with:
      env: ${{ matrix.env }}
    secrets:
      sops_age_key_development: ${{ secrets.SOPS_AGE_KEY_DEVELOPMENT }}
      sops_age_key_staging: ${{ secrets.SOPS_AGE_KEY_STAGING }}
      sops_age_key_production: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}

  verify:
    needs: decrypt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run loader unit tests
        run: bun test scripts/sops-decrypt.test.ts

      - name: Download decrypted .env artifact
        uses: actions/download-artifact@v4
        with:
          name: env-development
          path: env-artifacts

      - name: Download decrypted production .env artifact
        uses: actions/download-artifact@v4
        with:
          name: env-production
          path: env-artifacts

      - name: Stage .env for build
        run: |
          cp env-artifacts/.env.development ./.env.development 2>/dev/null || true
          cp env-artifacts/.env.dev ./.env.dev 2>/dev/null || true
          cp env-artifacts/.env.production ./.env.production 2>/dev/null || true
          cp env-artifacts/.env.product ./.env.product 2>/dev/null || true
          cp env-artifacts/.env.staging ./.env.staging 2>/dev/null || true
          cp env-artifacts/.env ./.env 2>/dev/null || true

      - name: Checkout canonical OpenAPI spec
        # public/openapi.yaml is gitignored and read by
        # src/app/api/openapi/route.ts at build time. Fresh CI checkouts
        # lack the workspace-shell submodule, so fetch the canonical
        # spec repo (same pattern as Android PR #22) and stage the copy.
        # Pinned-revision verification stays in W04 scope.
        uses: actions/checkout@v4
        with:
          repository: tastile/tastile-openapi
          path: openapi-spec
          ref: main

      - name: Stage public openapi.yaml for build
        run: cp openapi-spec/openapi.yaml ./public/openapi.yaml

      - name: Validate repository
        run: bun run check:release
        env:
          CLOUD_API_BASE: http://127.0.0.1:31400
          # Pin TZ so vitest workers deterministically match local dev (JST).
          # The schedule wire tests in quick-create-schedule-wire.test.ts
          # exercise LocalDate -> Instant conversion through
          # `new Date("YYYY-MM-DDT00:00:00")`, which is TZ-dependent on
          # purpose -- the conflict is documented in the test itself.
          # GitHub-hosted ubuntu-latest runners default to UTC; without
          # this pin the same tests pass on a JST laptop and fail on CI.
          # Mirrors deploy.yml, which already pins TZ for the release build.
          TZ: Asia/Tokyo
