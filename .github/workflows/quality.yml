name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare non-secret production build environment
        run: cp .env.product.example .env.product

      - name: Validate repository
        run: bun run check:release
        env:
          CLOUD_API_BASE: http://127.0.0.1:31400
