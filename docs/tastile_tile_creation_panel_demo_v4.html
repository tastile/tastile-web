 return `<div class="builder"><div class="choice-tabs"><button class="choice-tab on">最近使った</button><button class="choice-tab">同じプロジェクト</button><button class="choice-tab">ラベルのみ</button></div><div class="catalog">${items.map((x,i)=>`<button class="catalog-item ${i===0?'on':''}" data-catalog-item="${x[0]}"><div class="catalog-icon">${icon(usage==='gap'?'i-calendar':usage==='parent'?'i-folder':'i-tag')}</div><div><strong>${x[0]}</strong><small>${x[1]}</small></div><span class="catalog-role">${x[2]}</span></button>`).join('')}</div>${actionRow('選択')}</div>`;
}
function groupHtml(nested){return `<div class="builder"><div class="builder-section"><div class="builder-label">このグループ</div><div class="choice-tabs"><button class="choice-tab on">すべて満たす</button><button class="choice-tab">どれかを満たす</button><button class="choice-tab">満たさない</button></div></div><div class="condition-box"><div class="condition-top"><strong>${nested?'親グループ > サブグループ':'配置候補の条件'}</strong><select class="logic-select"><option>ALL</option><option>ANY</option><option>NOT</option></select></div><div class="condition-line">${icon('i-calendar')}<span>平日の09:00〜18:00</span><button>${icon('i-more')}</button></div><div class="condition-line">${icon('i-link')}<span>「制作時間」の内側</span><button>${icon('i-more')}</button></div><div class="nested-box"><div class="condition-line">${icon('i-branch')}<span>空き10分以上 または 次予定なし</span><button>${icon('i-more')}</button></div></div><button class="add-subcondition" data-push="subgroup">＋ さらに内側のグループ</button></div><div class="builder-section"><div class="builder-label">条件を加える</div><div class="choice-tabs"><button class="choice-tab">時間</button><button class="choice-tab" data-push="catalog" data-usage="target">参照</button><button class="choice-tab">状態</button><button class="choice-tab">実績</button><button class="choice-tab" data-push="text-fact">テキスト</button></div></div>${actionRow(nested?'サブグループを追加':'グループを追加')}</div>`}
function schemaHtml(){return `<div class="schema-section"><div class="schema-section-head"><span>基本入力</span><span class="schema-status">直接対応</span></div><div class="schema-section-body"><div class="schema-map-row"><span class="schema-key">ScheduleTileDefinition</span><span class="schema-value">title / project・tagは整理メタデータ</span></div><div class="schema-map-row"><span class="schema-key">Plan.role</span><span class="schema-value">${state.role==='label'?'LABEL':'EXECUTABLE'}</span></div><div class="schema-map-row"><span class="schema-key">SourceSchedule.window</span><span class="schema-value">${state.whenMode==='none'?'制約なし':state.when.join('・')}</span></div><div class="schema-map-row"><span class="schema-key">required_duration_ms</span><span class="schema-value">${state.duration==null?'null / 生成しない':state.duration*60000}</span></div></div></div><div class="schema-section"><div class="schema-section-head"><span>条件木</span><span class="schema-status">直接対応</span></div><div class="schema-section-body"><div class="schema-map-row"><span class="schema-key">Condition</span><span class="schema-value">ALL / ANY / NOT / TERM</span></div><div class="schema-map-row"><span class="schema-key">Reference</span><span class="schema-value">用途別カタログ → target / pick</span></div><div class="schema-map-row"><span class="schema-key">NestingRule</span><span class="schema-value">親子候補。実体はPlacement.inside</span></div><div class="schema-map-row"><span class="schema-key">Planning / Flow</span><span class="schema-value">PlacementRule + 汎用Flow</span></div></div></div><div class="schema-section"><div class="schema-section-head"><span>画面上の重複表示</span><span class="schema-status compose">Read projection</span></div><div class="schema-section-body"><div class="schema-map-row"><span class="schema-key">入力行</span><span class="schema-value">編集の入口</span></div><div class="schema-map-row"><span class="schema-key">条件要約</span><span class="schema-value">論理上の位置を確認</span></div><div class="schema-map-row"><span class="schema-key">配置結果</span><span class="schema-value">ユーザーが受ける効果を確認</span></div></div></div><div class="schema-warning">${icon('i-info')}<span>「休憩」などの用途固有型は生成しません。参照・Gap・Condition・FlowOutputの組み合わせが、結果としてその動作を作ります。</span></div>`}
function setPreset(name){state={preset:name,...clone(presets[name]),panelStack:[],selectedCatalog:'school',draftWhenMode:null};closePanels();render()}
function addGenericRule(view){
 const map={'when-condition':{icon:'i-calendar',title:'平日の09:00〜18:00',sub:'Calendar / Window',path:'すべて'},reference:{icon:'i-link',title:'「制御工学」の10〜30分後',sub:'Reference / MomentTerm',path:'すべて'},nesting:{icon:'i-folder',title:'「制作時間」の内側',sub:'NestingRule / INSIDE',path:'すべて'},placement:{icon:'i-sliders',title:'親の空き時間への配置を許可',sub:'PlacementRule / PermitScope',path:'すべて'},group:{icon:'i-branch',title:'曜日 または ラベル範囲',sub:'ANY サブグループ',path:'どれか'},subgroup:{icon:'i-branch',title:'空き10分以上 または 次予定なし',sub:'ANY サブグループ',path:'どれか'},completion:{icon:'i-check',title:'時間とタスクをすべて満たす',sub:'Completion.root = ALL',path:'完了'},flow:{icon:'i-bolt',title:'条件成立時に配置候補を作る',sub:'Flow / ProposePlacement',path:'結果'},'text-fact':{icon:'i-text',title:'submission_status = submitted',sub:'FactTerm / Equal(String)',path:'すべて'}};
 const term=map[view];if(!term)return;
 if(!state.groups.length)state.groups.push({id:'custom',name:'追加条件',logic:'ALL',terms:[]});
 state.groups[0].terms.push(term);render();closePanels();showToast('条件を追加しました');
}
function applyTopPanel(){
 const top=state.panelStack.at(-1);if(!top)return;
 if(top.view==='when'){const mode=state.draftWhenMode??state.whenMode;state.whenMode=mode;state.when=mode==='none'?[]:mode==='reference'?['「制作時間」の内側','時間指定なし']:mode==='day'?['7月13日','09:00–18:00']:['7月13日–17日','09:00–18:00'];state.draftWhenMode=null;render();closePanels();return showToast('日時を反映しました')}
 if(top.view==='duration'){if(state.duration==null)state.duration=90;render();closePanels();return showToast('必要時間を反映しました')}
 if(top.view==='repeat'||top.view==='organize'||top.view==='behavior'){render();closePanels();return showToast('設定を反映しました')}
 if(top.view==='catalog'){popPanel();return}
 addGenericRule(top.view);
}
$('#headIcon').innerHTML=icon('i-layers');$('#schemaTop').innerHTML=`${icon('i-code')}構造`;$('#closeDemo').innerHTML=icon('i-x');$('#schemaButton').innerHTML=`${icon('i-code')}生成される構造を確認`;
document.addEventListener('click',e=>{
 const preset=e.target.closest('[data-preset]');if(preset)return setPreset(preset.dataset.preset);
 if(e.target.closest('#addCondition'))return openPanels('intent');
 if(e.target.closest('#schemaButton')||e.target.closest('#schemaTop'))return openPanels('schema');
 if(e.target.closest('#panelScrim')||e.target.closest('[data-panel-close]'))return closePanels();
 if(e.target.closest('[data-panel-back]')||e.target.closest('[data-panel-cancel]'))return popPanel();
 const push=e.target.closest('[data-push]');if(push)return pushPanel(push.dataset.push,{usage:push.dataset.usage});
 const quick=e.target.closest('[data-quick]');if(quick&&!e.target.closest('[data-clear]'))return openPanels(quick.dataset.quick);
 const open=e.target.closest('[data-open]');if(open)return openPanels(open.dataset.open);
 const clear=e.target.closest('[data-clear]');if(clear){e.stopPropagation();if(clear.dataset.clear==='when'){state.whenMode='none';state.when=[]}if(clear.dataset.clear==='duration')state.duration=null;render();return showToast('指定を削除しました')}
 const wm=e.target.closest('[data-when-mode]');if(wm){state.draftWhenMode=wm.dataset.whenMode;return renderPanels()}
 if(e.target.closest('[data-duration-none]')){state.duration=null;return renderPanels()}
 const step=e.target.closest('[data-step-duration]');if(step){state.duration=Math.max(10,(state.duration??90)+Number(step.dataset.stepDuration));return renderPanels()}
 const repeat=e.target.closest('[data-repeat]');if(repeat){state.repeat=repeat.dataset.repeat;return renderPanels()}
 const project=e.target.closest('[data-project]');if(project){state.project=project.dataset.project;return renderPanels()}
 const tag=e.target.closest('[data-tag]');if(tag){const t=tag.dataset.tag;state.tags=state.tags.includes(t)?state.tags.filter(x=>x!==t):[...state.tags,t];return renderPanels()}
 const role=e.target.closest('[data-role-mode]');if(role){state.role=role.dataset.roleMode;return renderPanels()}
 const cat=e.target.closest('[data-catalog-item]');if(cat){$$('.panel-layer.active .catalog-item').forEach(x=>x.classList.remove('on'));cat.classList.add('on');return}
 const tab=e.target.closest('.choice-tab');if(tab&&!tab.dataset.push&&!tab.dataset.repeat&&!tab.dataset.tag&&!tab.dataset.whenMode){const group=tab.parentElement;[...group.children].forEach(x=>x.classList.remove('on'));tab.classList.add('on');return}
 const day=e.target.closest('.day');if(day){day.classList.toggle('on');return}
 const sw=e.target.closest('.switch');if(sw){sw.classList.toggle('on');return}
 if(e.target.closest('[data-panel-apply]'))return applyTopPanel();
 if(e.target.closest('[data-panel-remove]')){const top=state.panelStack.at(-1);if(top?.view==='when'){state.whenMode='none';state.when=[]}if(top?.view==='duration')state.duration=null;render();closePanels();return showToast('指定を削除しました')}
 if(e.target.closest('#taskAdd')){state.tasks.push('新しいタスク');render();return}
 const eg=e.target.closest('[data-edit-group]');if(eg)return openPanels('group',{id:eg.dataset.editGroup});
 if(e.target.closest('#saveButton'))return showToast('タイルを作成しました');
 if(e.target.closest('#closeDemo'))return showToast('デモでは閉じません');
});
$('#titleInput').addEventListener('input',e=>{state.title=e.target.value;renderPreview()});
for(let i=0;i<=8;i++){const top=i*92;$('#timeCol').insertAdjacentHTML('beforeend',`<div class="hour" style="top:${top}px"><span>${String(i+8).padStart(2,'0')}:00</span></div>`);$$('.day-col').forEach(c=>c.insertAdjacentHTML('beforeend',`<div class="hour" style="top:${top}px"></div>`));}
render();
</script>
</body>
</html>
